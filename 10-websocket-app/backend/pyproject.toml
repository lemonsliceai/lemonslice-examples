[project]
name = "lemonslice-websocket-app-backend"
version = "0.1.0"
description = "FastAPI bridge for ElevenLabs Conversational AI and LemonSlice over LiveKit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "livekit-api>=1.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lemonslice_bridge"]
