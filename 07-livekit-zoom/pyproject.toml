[project]
name = "livekit-zoom-avatar"
version = "1.0.0"
description = "Send a LemonSlice avatar into Zoom, Google Meet, Microsoft Teams, or Webex via LiveKit Agents"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "livekit-agents[lemonslice]>=1.6.5",
    "livekit-plugins-openai>=1.6.5",
    "livekit-plugins-groq>=1.6.5",
    "livekit-plugins-elevenlabs>=1.6.5",
    "python-dotenv>=1.2.1",
]

[tool.uv]
package = false
